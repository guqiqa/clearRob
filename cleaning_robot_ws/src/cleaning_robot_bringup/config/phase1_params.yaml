# Default parameters for Phase 1 — chassis control
# Load with: ros2 launch cleaning_robot_bringup phase1_chassis.launch.py

# ---- chassis_driver ----
chassis_driver:
  ros__parameters:
    # CAN
    can_interface: "can0"

    # Control limits (calibrated from candump data)
    max_velocity: 0.5          # m/s (cmd_vel compat mapping)
    max_angular_velocity: 2.0  # rad/s (cmd_vel compat mapping)

    # Safety
    cmd_vel_timeout_ms: 500    # cmd_vel timeout → failsafe
    intent_timeout_ms: 300     # /chassis/intent timeout → falls back

    # Simulation
    simulate: false            # Set true for PC testing without CAN hardware

    # ====================================================================
    # chassis_core — the C++ field-tuned control engine (colleague WheelPID V2
    # embedded via pybind11).  These override the config.py defaults; every key
    # maps to chassis_core::configFromDict.  See 需求文档_底盘核心架构.md for
    # the full key↔config.xml↔meaning table.
    # ====================================================================
    chassis_core:
      # Motor hardware
      pole_pairs: 10
      gear_ratio: 5.2
      wheel_radius: 0.10
      track_width: 0.45
      motor_ids: [2, 1, 4, 3]      # FL, RL, FR, RR
      motor_dirs: [-1, -1, 1, 1]   # flipped 2026-08-04: colleague's [1,1,-1,-1] tested REVERSED on ground → all 4 flipped to match Python-port calibration
      mower_id: 5

      # Direction sign (formal config.xml §2 Motion_Forward_RPM_Sign)
      # Unified RPM target sign: -1 flips all wheel targets so physical forward
      # is negative RPM in the control logic.  This parameter plus motor_dirs
      # completely determines the wheel→chassis mapping.  The formal version
      # uses original dirs [1,1,-1,-1] + Sign=-1; our flipped dirs [-1,-1,1,1]
      # already embed this sign, so this parameter is informational for now.
      motion_forward_rpm_sign: -1

      # Base speed
      run_rpm: 100
      rotate_rpm: 50
      turn_max_rpm: 0

      # Steering model
      turn_inner_ratio: -0.20
      arc_turn_blend_ms: 700

      # In-place rotation (5.00A factory torque)
      rotate_in_place_enable: true
      rotate_direction_sign: 1
      rotate_factory_current_control_enable: true
      rotate_neutral_hold_ms: 150
      rotate_speed_guard_enable: true
      rotate_start_max_rpm: 25.0
      rotate_start_guard_timeout_ms: 1200
      rotate_max_current: 500

      # Speed ramp
      speed_accel_rpm_s: 10
      speed_decel_rpm_s: 30

      # ==================================================================
      # Wheel speed-loop — RC/manual mode (formal config.xml §4 / ours)
      # ==================================================================
      wheel_control_mode: "current"
      wheel_speed_kp: 0.60
      wheel_speed_ki: 0.05
      wheel_feedforward_current: 24
      wheel_max_current: 35
      wheel_integral_max_current: 10

      # Startup current ramp
      wheel_start_initial_current: 55
      wheel_start_step_current: 2
      wheel_start_step_ms: 200
      wheel_start_max_current: 70
      wheel_start_threshold_rpm: 2
      wheel_start_confirm_samples: 1
      wheel_stall_threshold_rpm: 1
      wheel_stall_confirm_samples: 3
      wheel_start_timeout_ms: 7000
      wheel_overspeed_rpm: 120
      speed_feedback_timeout_ms: 1000

      # ---- Post-start anti-stutter (formal config.xml §4, ROS2 section) ----
      # After the startup ramp engages the PI loop, the PI's first tick sees a
      # huge negative error (ramp≪measured) and slams reverse current → the
      # wheel speed dips below the stall threshold → re-start cycle → stutter.
      # The post-start hold keeps a minimum run current for `wheel_post_start_hold_ms`
      # after the startup ramp confirms rotation, bridging the startup→PI gap.
      # A dedicated `wheel_post_start_current` (higher than the PI limit) holds
      # the wheel spinning while the ramp catches up.
      wheel_post_start_hold_ms: 500      # hold after startup confirmation [formal: ROS2 500ms]
      wheel_post_start_current: 48       # current during post-start hold, ×10mA
      wheel_min_run_current: 42          # minimum running current, ×10mA  [formal: ROS2 42]

      # ==================================================================
      # ROS2 autonomous-mode speed loop (formal config.xml §13)
      # Separate, larger-current params for ROS2 autonomous control vs RC.
      # Kp higher (0.80 vs 0.60), max current 130 (1.3A) vs 35 (0.35A) —
      # autonomous nav needs more torque authority than human remote control.
      # ==================================================================
      ros2_enable: true
      ros2_cmd_timeout_ms: 300
      ros2_publish_tf: true
      ros2_odom_frame: "odom"
      ros2_base_frame: "base_link"
      ros2_wheel_control_mode: "current"
      ros2_wheel_speed_kp: 0.80
      ros2_wheel_speed_ki: 0.010
      ros2_wheel_feedforward_current: 30
      ros2_wheel_max_current: 130
      ros2_wheel_integral_max_current: 10
      ros2_wheel_start_initial_current: 130
      ros2_wheel_start_max_current: 170

      # ==================================================================
      # Velocity / acceleration limits (formal config.xml §8)
      # Caps linear/angular velocity and accel for ROS2 autonomous mode.
      # 0 = unlimited.
      # ==================================================================
      max_velocity_mps: 0.0              # 0=unlimited
      max_angular_radps: 0.0             # 0=unlimited
      max_accel_mps2: 0.40
      max_decel_mps2: 0.60
      max_angular_accel_radps2: 1.00

      # Mower (Phase 2)
      cut_current: 0

      # RC channel thresholds (SBUS raw 172-1811)
      low_threshold: 800
      high_threshold: 1199
      throttle_channel: 3
      steering_channel: 4
      mower_channel: 2
      gear_channel: 6

      # Failsafe / timing
      failsafe_ms: 300
      heartbeat_ms: 200
      control_ms: 50
      speed_query_ms: 50

      # Gear profiles (SBUS gear switch / intent gear)
      gear_select_enable: true
      gear_low_run_rpm: 70
      gear_low_turn_max_rpm: 70
      gear_mid_run_rpm: 120
      gear_mid_turn_max_rpm: 100
      gear_high_run_rpm: 140
      gear_high_turn_max_rpm: 100

      # App / multi-source control (the ROS2 shell also exposes /chassis/intent)
      app_control_enable: true
      app_udp_port: 8091
      app_timeout_ms: 300

      # Logging (off to keep the log quiet)
      show_log: false

      # IMU heading hold
      imu_heading_enable: true
      imu_yaw_sign: -1.0
      imu_calibrate_ms: 3000
      imu_deadband_dps: 0.30
      heading_kp: 1.2
      heading_ki: 0.0
      heading_kd: 0.2
      heading_integral_max_correction: 0
      heading_max_correction: 5
      heading_correction_sign: -1
      heading_forward_trim: 0
      heading_reverse_trim: 0
      heading_reset_steering_hold_ms: 500

      # Direction-change hold (brake before reversing)
      direction_change_hold_enable: true
      direction_change_stop_rpm: 5.0
      direction_change_hold_timeout_ms: 1500
      direction_change_post_hold_ms: 1000
      direction_change_post_max_diff_rpm: 4

      # Lateral hold (off by default)
      lateral_hold_enable: false
      lateral_kp_deg_per_m: 0.0
      lateral_max_heading_deg: 0.0

# ---- imu_driver ----
imu_driver:
  ros__parameters:
    device: "/dev/qmi8658_imu"
    frame_id: "imu_link"
    publish_rate: 200

    # Calibration coefficients (from vendor QMI8658 datasheet)
    accel_bias_x: 0.320
    accel_bias_y: 0.027
    accel_bias_z: 0.802
    accel_scale_z: 0.991
    gyro_bias_x: 0.0265
    gyro_bias_y: -0.0135
    gyro_bias_z: 0.0132

    simulate: false

# ---- rtk_driver ----
rtk_driver:
  ros__parameters:
    device: "/dev/ttyS2"
    baudrate: 460800
    frame_id: "gps_link"

    simulate: false
    sim_lat: 31.2304
    sim_lon: 121.4737

# ---- remote_driver ----
remote_driver:
  ros__parameters:
    device: "/dev/ttyS1"
    baudrate: 115200
    frame_id: "rc_link"

    # C7mini 8-channel, travel 1000-2000
    axis_deadzone: 0.05
    ch_steering: 0       # CH1: right stick L/R
    ch_throttle: 2       # CH3: left stick F/B
    ch_btn_start: 4      # CH5: SWA (3-pos 200/1000/1800, START/STOP) — calibrated 2026-08-03
    ch_btn_estop: 5      # CH6: SWB (2-pos 1000/200, ESTOP) — calibrated 2026-08-03

    simulate: false

# ---- master_bridge ----
master_bridge:
  ros__parameters:
    max_linear_velocity: 0.5
    max_angular_velocity: 2.0
    axis_steering: 0           # Joy.axes[0] = steering
    axis_throttle: 1           # Joy.axes[1] = throttle
    btn_start_stop: 0          # Joy.buttons[0] = SWA (CH6)
    btn_estop: 2               # Joy.buttons[2] = SWB (CH7)
    estop_debounce_ms: 200
