stereo_depth:
  ros__parameters:
    # Input topics should be rectified before SGBM. If the camera frontend only
    # provides raw frames, set calibration_file and keep assume_rectified=false
    # so this node performs OpenCV rectification.
    left_image_topic: "sensor/stereo/left/image_raw"
    right_image_topic: "sensor/stereo/right/image_raw"
    left_camera_info_topic: "sensor/stereo/left/camera_info"
    right_camera_info_topic: "sensor/stereo/right/camera_info"
    assume_rectified: false
    require_calibration: true
    calibration_file: ""
    checkerboard_cols: 7
    checkerboard_rows: 10
    square_size_m: 0.02

    # QSM602HA-GL has limited shared compute, so defaults favor SLAM utility
    # over dense high-FPS depth.
    target_fps: 5.0
    compute_width: 544
    compute_height: 640
    publish_depth: true
    publish_aligned_depth_compat: true
    publish_disparity: true
    publish_pointcloud: true
    pointcloud_stride: 12
    pointcloud_max_points: 12000

    # Stereo geometry. CameraInfo overrides focal_px/baseline_m when available.
    focal_px: 600.0
    # Physical left/right camera spacing: 70 mm (CZY1D5068-V1 module).
    baseline_m: 0.07
    depth_min_m: 0.25
    depth_max_m: 8.0

    # StereoSGBM, tuned conservatively for CPU use.
    num_disparities: 64
    block_size: 7
    uniqueness_ratio: 10
    speckle_window_size: 80
    speckle_range: 2
    disp12_max_diff: 1

    # Main distance ROI, centered by default.
    roi_x: 240
    roi_y: 290
    roi_width: 64
    roi_height: 60
    min_valid_ratio: 0.05
    max_pair_time_diff_ms: 5.0

    # HTTP/WebSocket lightweight debug API.
    enable_http: true
    http_host: "0.0.0.0"
    http_port: 8091

    simulate_input: false
    frame_id: "stereo_camera_link"
    status_timeout_s: 2.0
