name: yolo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - numpy
  - opencv
  - pillow
  - pyyaml
  - tensorboard
  - matplotlib
  - pandas
  - seaborn
  - tqdm
  - pip:
    - ultralytics>=8.1.0
    - onnx>=1.15.0
    - onnxruntime-gpu>=1.16.0
    - onnx-simplifier
    - thop
