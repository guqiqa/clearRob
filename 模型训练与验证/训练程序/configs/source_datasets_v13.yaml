# V13: 8-class detection (vehicle+road_obstacle merged → obstacle)
# datas: person→pedestrian, car→obstacle, trafficcone→obstacle, pothole→stain
# street_obstacle: vehicle+road_obstacle → obstacle, sign IDs discarded

datasets:
  # ===== 垃圾类数据源 =====
  - name: taco
    path: "../数据集/raw/taco"
    format: "coco_taco"
    mapping: "taco_v9"
    annotation_file: "annotations.json"

  - name: trainval_voc
    path: "../数据集/raw/trainval_voc"
    format: "voc_xml"
    mapping: "trainval_voc"
    prefix: "tvl"

  - name: garbages_annotated
    path: "../数据集/raw/garbages_annotated"
    format: "labelme_folder"
    mapping: "garbages_annotated_v9"

  - name: garbages
    path: "../数据集/raw/garbages"
    format: "folder_class"
    mapping: "garbages_v9"
    samples_per_class: 0
    class_filter: ["Recyclable", "Kitchen", "Harmful", "Other"]
    samples_per_filtered:
      Recyclable: 2800
      Kitchen: 2800
      Harmful: 2800
      Other: 2800
    box_margin: 0.9

  - name: leaf_classify
    path: "../数据集/raw/leaf_classify"
    format: "csv_classify"
    mapping: "leaf_v9"
    samples_per_class: 4000
    box_margin: 0.9

  - name: dataset_resized
    path: "../../date/dataset-resized/dataset-resized"
    format: "folder_class"
    mapping: "dataset_resized"
    samples_per_class: 0
    box_margin: 0.9
    prefix: "dsr"

  # ===== 检测目标数据源 =====
  - name: datas
    path: "../数据集/raw/datas"
    format: "coco_flat"
    mapping: "datas_v13"
    annotation_file: "train.json"
    prefix: "dat"
    per_class_cap:
      pedestrian: 3
      obstacle: 3

  - name: pedestrian_coco
    path: "../../date/行人-coco/coco"
    format: "coco_flat"
    mapping: "pedestrian_coco"
    annotation_file: "annotations/train.json"
    img_subdir: "train"
    prefix: "person"

  - name: car_identify
    path: "../../date/car-identify/car-main/dataset/dataset"
    format: "voc_xml"
    mapping: "car_identify"
    ann_subdir: "annotation"
    img_subdir: "images"
    prefix: "car"

  # ===== 道路障碍 =====
  - name: street_obstacle
    path: "../数据集"
    format: "yolo_remap"
    mapping: "street_obstacle_v13"
    prefix: "street"

  # ===== 积水/污渍 =====
  - name: puddle_voc
    path: "../数据集/raw/puddle_voc"
    format: "voc_xml"
    mapping: "puddle_v9"
    prefix: "pdl"

  - name: puddle_large
    path: "../数据集/raw/puddle_large"
    format: "yolo_remap"
    mapping: "puddle_large_v9"
    prefix: "pdl_lg"

  - name: cb8c9_water
    path: "../../date/cb8c9-main/cb8c9-main"
    format: "voc_xml"
    mapping: "cb8c9_water"
    prefix: "water"

  # ===== 自采数据 =====
  - name: self_collected
    path: "../数据集/raw/self_collected"
    format: "labelme_json"
    mapping: "self_v13"
    prefix: "self"
