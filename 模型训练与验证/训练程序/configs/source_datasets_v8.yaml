# V8 数据源注册 — 全部数据集（除 TACO），统一映射
datasets:
  - name: garbages
    path: "../数据集/raw/garbages"
    format: "folder_class"
    mapping: "garbages"
    mapping_file: "label_mapping_v8.yaml"
    samples_per_class: 7000      # 每类 7k, 共 28k

  - name: garbage_classify
    path: "../数据集/raw/garbage_classify"
    format: "classify_csv"
    mapping: "garbage_classify"
    mapping_file: "label_mapping_v8.yaml"

  - name: train_classify
    path: "../数据集/raw/train_classify"
    format: "folder_40class"      # folder with 0-39 numeric subdirs
    mapping: "train_classify"
    mapping_file: "label_mapping_v8.yaml"

  - name: leaf_classify
    path: "../数据集/raw/leaf_classify"
    format: "csv_classify"
    mapping: "leaf_classify"
    mapping_file: "label_mapping_v8.yaml"

  - name: datas
    path: "../数据集/raw/datas"
    format: "coco_flat"
    mapping: "datas"
    mapping_file: "label_mapping_v8.yaml"
    annotation_file: "train.json"
    per_class_cap:
      pedestrian_pet: 3
      road_obstacle: 5

  - name: trashnet
    path: "../数据集/raw/trashnet"
    format: "folder_class"
    mapping: "trashnet"
    mapping_file: "label_mapping_v8.yaml"

  - name: puddle_voc
    path: "../数据集/raw/puddle_voc"
    format: "voc_xml"
    mapping: "puddle_voc"
    mapping_file: "label_mapping_v8.yaml"

  - name: street_obstacle
    path: "../数据集"
    format: "yolo_remap"
    mapping: "street_obstacle"
    mapping_file: "label_mapping_v8.yaml"

  - name: puddle_large
    path: "../数据集/raw/puddle_large"
    format: "yolo_remap"
    mapping: "puddle_large"
    mapping_file: "label_mapping_v8.yaml"
