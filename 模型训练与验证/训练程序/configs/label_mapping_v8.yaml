  # ── dataset-resized (TrashNet): 文件夹 6 类 ──
  trashnet:
    cardboard: recyclable
    glass: recyclable
    metal: recyclable
    paper: recyclable
    plastic: recyclable
    trash: other_waste

  # ── cb8c9-main (puddle): VOC XML ──
  puddle_voc:
    water: stain

  # ── street_obstacle: 22 类 YOLO ──
  street_obstacle:
    0: discard            # chair
    1: discard            # fence
    2: road_obstacle      # garbage bin
    3: discard            # pole
    4: road_obstacle      # obstacle
    5: road_obstacle      # tree
    6: road_obstacle      # plant pot
    7: discard            # stair
    8: discard            # bad road
    9: pedestrian_pet     # street vendor
    10: discard           # drain
    11: discard           # pothole
    12: discard           # gate barrier
    13: stain             # puddle → stain
    14: road_obstacle     # motorcycle
    15: road_obstacle     # car
    16: discard           # left turn
    17: pedestrian_pet    # pedestrian
    18: road_obstacle     # roadblock
    19: road_obstacle     # door
    20: discard           # right turn
    21: discard           # zebra cross

  # ── puddle_large: YOLO 格式 ──
  puddle_large:
    0: stain
