# V12: garbages_annotated + trainval_voc + full-image supplement (~25.6% full-img)
# Real detection: taco, datas, street_obstacle, puddle_voc, puddle_large, self_collected
# + garbages_annotated (3,817 manual LabelMe bboxes)
# + trainval_voc (7,778 VOC real bboxes)
# Full-image: garbages 15,500 + leaf_classify 4,000, all margin=0.9
# Expected: ~40,000 images, ~46,000 boxes, ~25.6% full-image ratio

datasets:
  - name: taco
    path: "../数据集/raw/taco"
    format: "coco_taco"
    mapping: "taco_v9"
    annotation_file: "annotations.json"

  - name: datas
    path: "../数据集/raw/datas"
    format: "coco_flat"
    mapping: "datas_v9"
    annotation_file: "train.json"
    per_class_cap:
      pedestrian_pet: 3
      road_obstacle: 5

  - name: street_obstacle
    path: "../数据集"
    format: "yolo_remap"
    mapping: "street_obstacle_v9"

  - name: puddle_voc
    path: "../数据集/raw/puddle_voc"
    format: "voc_xml"
    mapping: "puddle_v9"

  - name: puddle_large
    path: "../数据集/raw/puddle_large"
    format: "yolo_remap"
    mapping: "puddle_large_v9"

  - name: self_collected
    path: "../数据集/raw/self_collected"
    format: "labelme_json"
    mapping: "self_v9"

  - name: trainval_voc
    path: "../数据集/raw/trainval_voc"
    format: "voc_xml"
    mapping: "trainval_voc"

  - name: garbages_annotated
    path: "../数据集/raw/garbages_annotated"
    format: "labelme_folder"
    mapping: "garbages_annotated_v9"

  - name: garbages
    path: "../数据集/raw/garbages"
    format: "folder_class"
    mapping: "garbages_v9"
    samples_per_class: 0
    class_filter: ["Recyclable", "Kitchen", "Hazardous", "Other"]
    samples_per_filtered:
      Recyclable: 3900
      Kitchen: 3800
      Hazardous: 3900
      Other: 3900
    box_margin: 0.9

  - name: leaf_classify
    path: "../数据集/raw/leaf_classify"
    format: "csv_classify"
    mapping: "leaf_v9"
    samples_per_class: 4000
    box_margin: 0.9
