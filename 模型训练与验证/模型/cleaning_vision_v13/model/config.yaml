# 模型元信息 — V13 YOLO11s 8-class
# Source: training run v13_8cls, epoch 156 (best mAP50)
model:
  name: "cleaning_v1.3.0_s"
  version: "1.3.0"
  scale: "s"
  architecture: "YOLO11"
  framework: "ultralytics 8.x"

  # 输入规格
  input:
    width: 640
    height: 640
    channels: 3
    format: "RGB"
    normalization: "0.0-1.0"
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

  # 输出规格
  output:
    num_classes: 8
    class_names:
      0: "recyclable"       # 可回收垃圾
      1: "kitchen_waste"    # 厨余垃圾
      2: "hazardous"        # 有害垃圾
      3: "other_waste"      # 其他垃圾
      4: "green_waste"      # 绿化垃圾
      5: "pedestrian"       # 行人/宠物/骑行者 (V13: pedestrian_pet→pedestrian)
      6: "obstacle"         # 道路障碍物+车辆合并 (V13: road_obstacle+vehicle→obstacle)
      7: "stain"            # 污渍/积水
    output_format: "xyxy_conf_cls"

  # 推理建议参数
  inference:
    conf_threshold: 0.25
    iou_threshold: 0.45
    max_det: 300

  # 性能指标 (epoch 156)
  metrics:
    map50: 0.7832
    map50_95: 0.6491
    precision: 0.7922
    recall: 0.7251
    model_params: 9415896
    model_size_mb: 18.3

  # 来源信息
  source:
    training_run: "v13_8cls"
    dataset_version: "v13"
    base_weights: "yolo11s.pt"
    epochs: 186 (early stop, patience=30)
    date: "2026-07-06"

# V13 vs V11 主要变更:
#   - pedestrian_pet (V11 id=6) → pedestrian (V13 id=5): 仅保留行人/宠物，移除车辆
#   - road_obstacle (V11 id=5) → obstacle (V13 id=6): 合并原road_obstacle+车辆
#   - 新增 car_identify, pedestrian_coco, pothole 等数据集
#   - mAP50: 0.720 (V11) → 0.783 (V13)
